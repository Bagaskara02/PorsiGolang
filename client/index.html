<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porsi.</title>

  <!-- Font Google: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Kerangka Kerja Bootstrap 5.3 & Ikon Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Lembar Gaya Kustom Terstruktur -->
  <link rel="stylesheet" href="css/style.css?v=26">
  <link rel="stylesheet" href="css/auth.css?v=18">
</head>
<body>

  <!-- Bilah Navigasi Melayang Bentuk Kapsul (Floating Island Navbar) -->
  <header class="app-navbar-wrapper">
    <div class="app-navbar-pill">
      <!-- Sisi Kiri: Logo & Nama Brand -->
      <a href="#" class="brand-logo" onclick="switchPage('home'); return false;">
        <span class="brand-title">porsi<span class="brand-dot">.</span></span>
      </a>

      <!-- Sisi Tengah: Tab Navigasi Menu (Web Desktop Navigasi Kapsul) -->
      <nav class="desktop-nav nav-center-tabs" id="nav-center-tabs" aria-label="Navigasi Utama">
        <div class="nav-sliding-indicator" id="nav-sliding-indicator"></div>
        <button type="button" class="nav-tab-btn active" id="nav-btn-home" onclick="switchPage('home')">
          Home
        </button>
        <button type="button" class="nav-tab-btn" id="nav-btn-makanan" onclick="switchPage('makanan')">
          Makanan
        </button>
        <button type="button" class="nav-tab-btn" id="nav-btn-catat" onclick="requireAuthOrGo('catat')">
          Catat
        </button>
        <button type="button" class="nav-tab-btn" id="nav-btn-dashboard" onclick="requireAuthOrGo('dashboard')">
          Ringkasan
        </button>
        <button type="button" class="nav-tab-btn" id="nav-btn-riwayat" onclick="requireAuthOrGo('riwayat')">
          Riwayat
        </button>
      </nav>

      <!-- Sisi Kanan: Tombol Aksi Pengguna / Tamu -->
      <div class="nav-right-actions">
        <!-- Aksi untuk Tamu (Belum Masuk Akun) -->
        <div id="guest-actions" class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-nav-ghost" onclick="openLoginModal()">Masuk</button>
          <button type="button" class="btn btn-nav-cta" onclick="openRegisterModal()">
            <span>Mulai</span> <i class="bi bi-arrow-right-short ms-1" style="font-size: 16px;"></i>
          </button>
        </div>

        <!-- Aksi Pengguna (Sudah Terautentikasi / Login) -->
        <div id="user-actions" class="d-none align-items-center gap-2">
          <div class="nav-user-pill" onclick="requireAuthOrGo('profil')" title="Lihat Profil & Kebutuhan Kalori">
            <!-- Mini Progress Ring Melingkar di Avatar Pengguna -->
            <div class="nav-user-avatar-wrap position-relative">
              <svg class="mini-progress-ring" width="34" height="34" viewBox="0 0 34 34">
                <circle class="ring-bg" cx="17" cy="17" r="14" fill="none" stroke="#EAECE6" stroke-width="2.6" />
                <circle class="ring-progress" id="top-user-progress-ring" cx="17" cy="17" r="14" fill="none" stroke="var(--olive)" stroke-width="2.6" stroke-dasharray="87.96" stroke-dashoffset="87.96" stroke-linecap="round" transform="rotate(-90 17 17)" />
              </svg>
              <div class="nav-user-avatar">
                <i class="bi bi-person-fill"></i>
              </div>
            </div>
            <div class="d-block text-start user-text-block" style="line-height: 1.15;">
              <div class="fw-semibold user-name-label" id="top-user-name">User</div>
              <div class="text-secondary user-target-label" id="top-user-target">0 kkal</div>
            </div>
          </div>
          <button type="button" class="btn-nav-logout" onclick="logout()" title="Keluar">
            <i class="bi bi-box-arrow-right" style="-webkit-text-stroke: 0.5px;"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Kontainer Konten Utama Aplikasi (Dimuat per view dari folder views/) -->
  <main class="container-lg py-3 py-md-4" id="main-content">
    <!-- Skeleton Fallback Placeholder (Mencegah Layar Blank Saat CSR Memuat Data Awal) -->
    <div id="main-skeleton-loader" class="main-skeleton-loader">
      <div class="skeleton-shimmer skeleton-hero mb-3"></div>
      <div class="row g-3">
        <div class="col-12 col-md-8"><div class="skeleton-shimmer skeleton-card-lg"></div></div>
        <div class="col-12 col-md-4"><div class="skeleton-shimmer skeleton-card-sm"></div></div>
      </div>
    </div>

    <div id="view-home"></div>
    <div id="view-makanan"></div>
    <div id="view-dashboard"></div>
    <div id="view-catat"></div>
    <div id="view-riwayat"></div>
    <div id="view-profil"></div>
  </main>

  <!-- Bilah Navigasi Bawah Khusus Smartphone (Mobile Bottom Navigation Bar) -->
  <nav class="mobile-bottom-nav d-md-none" id="mobile-bottom-nav" aria-label="Navigasi Bawah Ponsel">
    <div class="bottom-nav-inner">
      <button type="button" class="bottom-nav-item active" id="mob-btn-home" onclick="switchPage('home')">
        <i class="bi bi-house-door bottom-nav-icon"></i>
        <span class="bottom-nav-label">Home</span>
      </button>
      <button type="button" class="bottom-nav-item" id="mob-btn-makanan" onclick="switchPage('makanan')">
        <i class="bi bi-compass bottom-nav-icon"></i>
        <span class="bottom-nav-label">Makanan</span>
      </button>
      <button type="button" class="bottom-nav-item bottom-nav-action-center" id="mob-btn-catat" onclick="requireAuthOrGo('catat')" aria-label="Catat Piring">
        <div class="action-center-circle">
          <i class="bi bi-plus-lg"></i>
        </div>
        <span class="bottom-nav-label">Catat</span>
      </button>
      <button type="button" class="bottom-nav-item" id="mob-btn-dashboard" onclick="requireAuthOrGo('dashboard')">
        <i class="bi bi-pie-chart bottom-nav-icon"></i>
        <span class="bottom-nav-label">Ringkasan</span>
      </button>
      <button type="button" class="bottom-nav-item" id="mob-btn-riwayat" onclick="requireAuthOrGo('riwayat')">
        <i class="bi bi-calendar3 bottom-nav-icon"></i>
        <span class="bottom-nav-label">Riwayat</span>
      </button>
    </div>
  </nav>

  <!-- Kontainer Komponen Modal & Toast (Dimuat dari views/modals.html) -->
  <div id="views-modals"></div>

  <!-- Pustaka JavaScript Bootstrap 5 Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Berkas Logika Utama Aplikasi (JavaScript Terstruktur) -->
  <script src="js/app.js?v=29"></script>
</body>
</html>
